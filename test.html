  <style>
    main#content {
      display: block;
    }

    /* Keep portal cards aligned and equally tall within each row. */
    .masonry-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      height: auto !important;
      position: static !important;
    }

    .masonry-grid::before,
    .masonry-grid::after {
      content: none;
    }

    .masonry-grid > .widget-block {
      display: flex;
      float: none;
      margin-bottom: 30px;
      position: static !important;
      transform: none !important;
    }

    .widget-block-inner {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      color: #212529 !important;
    }
